
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Attribute Selectors</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1d2671, #c33764);
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: white;
        }

        .form-container {
            background-color: white;
            max-width: 450px;
            margin: 30px auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #0004;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #333;
        }

        /* Text input */
        input[type="text"] {
            border: 2px solid #3498db;
        }

        /* Email input */
        input[type="email"] {
            border: 2px solid #2ecc71;
        }

        /* Password input */
        input[type="password"] {
            border: 2px solid #9b59b6;
        }

        /* Number input */
        input[type="number"] {
            border: 2px solid orange;
        }

        /* All input fields */
        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            box-sizing: border-box;
            border-radius: 7px;
            font-size: 15px;
        }

        /* Required fields */
        input[required] {
            background-color: #fff8e6;
        }

        /* Disabled fields */
        input[disabled] {
            background-color: #ddd;
            cursor: not-allowed;
        }

        /* Placeholder selector */
        input[placeholder] {
            color: #333;
        }

        /* Focus effect */
        input:focus {
            outline: 3px solid #cbdcf5;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background-color: #21618c;
        }

        footer {
            text-align: center;
            color: white;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>CSS Attribute Selectors</h1>

    <div class="form-container">

        <h2>Registration Form</h2>

        <form>

            <label>Full Name:</label>
            <input type="text"
                   placeholder="Enter your name"
                   required>

            <label>Email Address:</label>
            <input type="email"
                   placeholder="Enter your email"
                   required>

            <label>Password:</label>
            <input type="password"
                   placeholder="Enter your password"
                   required>

            <label>Age:</label>
            <input type="number"
                   placeholder="Enter your age">

            <label>Username:</label>
            <input type="text"
                   value="Student"
                   disabled>

            <button type="submit">
                Register Now
            </button>

        </form>

    </div>

    <footer>
        <p>Created with HTML and CSS</p>
    </footer>

</body>
</html>
